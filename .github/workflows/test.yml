# Reusable test workflow.
#
# Called by:
#   - ci.yml              (PR checks + manual dispatch)
#   - release-prepare.yml (tag gate, before anything is published)
#
# Not triggered directly — `workflow_call` only.
#
# Every third-party action is pinned to a commit SHA, with its release in a
# trailing comment. A tag can move. A SHA cannot, so a retagged action cannot
# enter a run that holds a crates.io token. Dependabot keeps the pins current
# (.github/dependabot.yml).
#
# Jobs:
#   lint     — rustfmt, docs, shellcheck
#   clippy   — `-D warnings` on every feature set the matrix names
#   test     — the test suite with every feature, against generated fixtures
#   msrv     — the MSRV from Cargo.toml
#   audit    — cargo-deny: advisories, licences, sources, banned crates

name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Format, Docs & Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lint

      - name: Check formatting
        run: cargo fmt --all --check

      # Warnings are denied: a link to a private item renders as plain text
      # rather than an error, so the published docs lose it with no report.
      - name: Build docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Shellcheck release scripts
        run: shellcheck scripts/ci/*.sh

  # ─────────────────────────────────────────────────────────────────────────
  # Each feature compiles alone, so a feature that leans on another one's
  # import fails here. `--all-targets` also checks the tests each feature
  # enables. Add a row for every new feature.
  clippy:
    name: Clippy (${{ matrix.features || 'no features' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { features: "" }
          - { features: "mp4" }
          - { features: "mkv" }
          - { features: "mp4,mkv" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: clippy

      - name: Clippy
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo clippy --features "$FEATURES" --all-targets -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────
  # The MP4/MOV fixtures come from tests/fixtures/gen_mp4.py, which runs
  # FFmpeg. Media never enters the repository.
  test:
    name: Test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: test

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate fixtures
        run: python3 tests/fixtures/gen_mp4.py

      - name: Run tests
        run: cargo test --all-features --no-fail-fast

  # ─────────────────────────────────────────────────────────────────────────
  # The MSRV comes from `package.rust-version`, so the published contract and
  # this job cannot drift apart. It is read with grep: the toolchain `cargo
  # metadata` would run on is the one this job is choosing.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV from the manifest
        id: msrv
        run: |
          set -euo pipefail
          MSRV=$(grep -m1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ -z "$MSRV" ]]; then
            echo "::error::rust-version is missing from Cargo.toml"
            exit 1
          fi
          echo "Declared MSRV: $MSRV"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: msrv-${{ steps.msrv.outputs.version }}

      # Library target only. Dev-dependencies are not part of the contract.
      - name: Check MSRV
        run: cargo check --lib --all-features

  # ─────────────────────────────────────────────────────────────────────────
  # `--exclude-dev`: dev-dependencies link test oracles only.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --exclude-dev check
